<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Tienda Pete</title>
    <link rel='stylesheet' href='style/style.css'>
</head>
<body>
    <header>
        <!-- HEADER $$$$$$$$$$$$$$$$$$$$$$$$$$$$ -->
        <div class="titulo">
            <h1>TIENDA PETE</h1>    
            <img src="https://lol-tracker.com/v2/logo/loltracker-square-logo.png" alt="LogoTienda" class="logo">
        </div>

        <nav class="header-nav">
            <a href="#">Sobre nosotros</a>
            <a href="#" id="biblioteca" class="oculto">Biblioteca</a>
        </nav>

        <div class="cuenta-invitado">
            <a href="#" id="btn-login">Iniciar Sesion</a>
            <a href="#" id="btn-registro">Registrarse</a>
        </div>

        <div id="cuenta-usuario" class="oculto">
            <span id="nombre">HOLA PEPE</span>
            <a href="#" id="btn-salir">Cerrar Sesion</a>
        </div>
        <!-- FIN HEADER $$$$$$$$$$$$$$$$$$ -->
    </header>
<!--POP UP REGISTRO $$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$-->
<div id="pop-registro" class="oculto">
    <span id="cerrar-registro" class="cerrar-simple">&times;</span>
    <h2>CREAR CUENTA</h2>
    <form id="form-registro">
        <label for="reg-usuario">Usuario</label>
        <input type="text" id="reg-usuario" required>

        <label for="reg-correo">Correo</label>
        <input type="email" id="reg-correo" required>

        <label for="reg-contrasena">Contraseña</label>
        <input type="password" id="reg-contrasena" required>

        <button type="submit">Registrarse</button>
    </form>
</div>
<!--FIN POP UP REGISTRO $$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$$-->
