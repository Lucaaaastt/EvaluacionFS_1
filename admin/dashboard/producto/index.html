<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creacion de producto</title>
    <link rel="stylesheet" href="/style/style.css" />
  </head>
  <body>
    <header>
      <!-- HEADER $$$$$$$$$$$$$$$$$$$$$$$$$$$$ -->
      <div class="titulo">
        <h1>TIENDA PETE</h1>
        <img
          src="https://lol-tracker.com/v2/logo/loltracker-square-logo.png"
          alt="LogoTienda"
          class="logo"
        />
      </div>

      <nav class="header-nav">
        <a href="#">Sobre nosotros</a>
        <a href="#" id="biblioteca" class="oculto">Biblioteca</a>
      </nav>

      <div class="cuenta-invitado">
        <a href="#" id="btn-login">Iniciar Sesion</a>
        <a href="#" id="btn-registro">Registrarse</a>
      </div>

      <div id="cuenta-usuario" class="oculto">
        <span id="nombre">HOLA PEPE</span>
        <a href="#" id="btn-salir">Cerrar Sesion</a>
      </div>
      <!-- FIN HEADER $$$$$$$$$$$$$$$$$$ -->
    </header>

    <section class="formulario-producto">
      <h2>CREAR NUEVO PRODUCTO</h2>

      <form id="formProducto">
        <label for="nombre">Nombre del producto</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          required
          minlength="3"
          maxlength="50"
          placeholder="Ej: Red Dead Redemption II"
        />

        <label for="precio">Precio</label>
        <input
          type="number"
          id="precio"
          name="precio"
          required
          min="0"
          step="1"
          placeholder="Ej: 64990"
        />

        <label for="stock">Stock inicial</label>
        <input
          type="number"
          id="stock"
          name="stock"
          required
          min="0"
          step="1"
          placeholder="Ej: 10"
        />

        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria" required>
          <option value="">Seleccionar categoría</option>
          <option value="Acción">Acción</option>
          <option value="Aventura">Aventura</option>
          <option value="RPG">RPG</option>
          <option value="Deportes">Deportes</option>
          <option value="Estrategia">Estrategia</option>
        </select>

        <label for="plataforma">Plataforma</label>
        <input
          type="text"
          id="plataforma"
          name="plataforma"
          list="plataformas"
          required
          placeholder="Ej: PC"
        />

        <datalist id="plataformas">
          <option value="PC"></option>
          <option value="PlayStation 5"></option>
          <option value="PlayStation 4"></option>
          <option value="Xbox Series X/S"></option>
          <option value="Xbox One"></option>
          <option value="Nintendo Switch"></option>
        </datalist>

        <label for="descripcion">Descripción</label>
        <textarea
          id="descripcion"
          name="descripcion"
          required
          minlength="10"
          maxlength="500"
          placeholder="Descripción del producto..."
        ></textarea>

        <label for="imagen">Imagen URL</label>
        <input
          type="url"
          id="imagen"
          name="imagen"
          required
          placeholder="https://ejemplo.com/imagen.png"
        />

        <button type="submit" class="btn-guardar">CREAR PRODUCTO</button>
      </form>
    </section>
    <script src="/admin/js/formulario-add-producto.js"></script>
  </body>
</html>
